<div class="glass-card panel-table-card fade-up">
    <div class="table-toolbar">
        <div>
            <h4 class="panel-title">{{ role|title }} Management</h4>
            <p class="panel-muted mb-0">Search, review and manage records.</p>
        </div>
    </div>
    <div class="table-responsive panel-scroll">
        <table class="table panel-table" id="managementTable">
            <thead><tr><th>S.No.</th><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Password</th><th>Remove</th></tr></thead>
            <tbody>
            {% for cust in customer %}
                <tr>
                    <td>{{ forloop.counter }}</td><td>{{ cust.username }}</td><td>{{ cust.Name }}</td><td>{{ cust.email }}</td><td>{{ cust.phone_number }}</td><td>{{ cust.password }}</td>
                    <td><a href="{% url 'User:delete_data' request.session.role role cust.username  %}" class="btn btn-soft-danger btn-sm panel-confirm" data-confirm="Remove this {{ role }}?">Remove</a></td>
                </tr>
            {% empty %}
                <tr><td colspan="7" class="text-center panel-muted">No records found.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
