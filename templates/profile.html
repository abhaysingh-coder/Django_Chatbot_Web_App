{% load static %}
<div class="profile-cover fade-up mb-4">
    <div class="d-flex flex-column flex-md-row align-items-center gap-4 position-relative">
        <img src="{% static 'icon.png' %}" class="rounded-circle profile-avatar" alt="Profile">
        <div class="text-center text-md-start">
            <div class="panel-kicker">Profile</div>
            <h2 class="fw-bold mb-1">{{ user.Name }}</h2>
            <p class="mb-0 text-white-50">{{ user.email }}</p>
        </div>
    </div>
</div>
<div class="row g-3">
    <div class="col-md-6"><div class="info-card"><i class="fa-solid fa-user mb-3"></i><h6 class="panel-muted">Username</h6><h4>{{ user.username }}</h4></div></div>
    <div class="col-md-6"><div class="info-card"><i class="fa-solid fa-id-card mb-3"></i><h6 class="panel-muted">Name</h6><h4>{{ user.Name }}</h4></div></div>
    <div class="col-md-6"><div class="info-card"><i class="fa-regular fa-envelope mb-3"></i><h6 class="panel-muted">Email</h6><h4 class="fs-5">{{ user.email }}</h4></div></div>
    <div class="col-md-6"><div class="info-card"><i class="fa-solid fa-phone mb-3"></i><h6 class="panel-muted">Phone</h6><h4>{{ user.phone_number }}</h4></div></div>
</div>
