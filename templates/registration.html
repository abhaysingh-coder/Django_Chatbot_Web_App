<div class="glass-card panel-table-card fade-up">
    <div class="table-toolbar">
        <div><h4 class="panel-title">Registration Requests</h4><p class="panel-muted mb-0">Approve pending {{ role|default:'user' }} registrations.</p></div>
        
    </div>
    <div class="table-responsive panel-scroll">
        <table class="table panel-table" id="registrationTable">
            <thead><tr><th>S.No.</th><th>Username</th><th>Name</th><th>Email</th><th>Phone No.</th><th>Actions</th></tr></thead>
            <tbody>
            {% for mes in user %}
                <tr><td>{{ forloop.counter }}</td><td>{{ mes.username }}</td><td>{{ mes.Name }}</td><td>{{ mes.email }}</td><td>{{ mes.phone_number }}</td><td><a href="{% url 'Admin:delete_user' mes.username role %}" class="btn btn-gold btn-sm">Approve</a></td></tr>
            {% empty %}
                <tr><td colspan="6" class="text-center panel-muted">No pending requests.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
