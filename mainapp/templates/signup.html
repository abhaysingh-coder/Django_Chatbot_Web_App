{% extends 'base.html' %}
{% load static %}
{% block title %}Signup | AI Chatbot{% endblock %}
{% block content %}
<div class="auth-header text-center">
    <div class="avatar-ring">
        <img src="{% static 'bot_avatar.png' %}" alt="Chatbot avatar">
    </div>
    <h3>Create Account</h3>
    <p>Register and start using your chatbot system</p>
</div>

<form method="post" class="auth-form needs-validation" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Register As</label>
        <div class="modern-input">
            <i class="fa-solid fa-users"></i>
            <select name="role" class="form-select" required>
                <option value="" selected disabled>Select role</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
                <option value="customer">Customer</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="modern-input">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        {% if error_message %}
        <p class="form-error"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ error_message }}</p>
        {% endif %}
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label">First Name</label>
            <div class="modern-input">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" name="first_name" class="form-control" placeholder="First name" required>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <div class="modern-input">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" name="last_name" class="form-control" placeholder="Last name" required>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="modern-input">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <div class="modern-input">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" name="phone_number" class="form-control" placeholder="10 digit phone number" maxlength="10" pattern="[0-9]{10}" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="modern-input">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control password-field" placeholder="Enter password" required>
            <button class="password-toggle" type="button" data-target="password" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
        <div class="password-strength mt-2" data-strength-for="password">
            <span></span>
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="modern-input">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" id="cpassword" name="confirm_password" class="form-control password-field" placeholder="Confirm password" required>
            <button class="password-toggle" type="button" data-target="cpassword" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
        <p class="password-match small mb-0 mt-2" id="passwordMatch"></p>
    </div>

    <button type="submit" class="btn auth-btn w-100">
        <span>Create Account</span>
        <i class="fa-solid fa-user-plus"></i>
    </button>

    <p class="auth-switch text-center mt-4 mb-0">
        Already have an account? <a href="{% url 'mainapp:Loginhome' %}">Login</a>
    </p>
</form>
{% endblock %}
