{% extends 'base.html' %}
{% load static %}
{% block title %}Login | AI Chatbot{% endblock %}
{% block content %}
<div class="auth-header text-center">
    <div class="avatar-ring">
        <img src="{% static 'bot_avatar.png' %}" alt="Chatbot avatar">
    </div>
    <h3>Welcome Back</h3>
    <p>Login to continue to your chatbot dashboard</p>
</div>

<form method="post" action="" class="auth-form needs-validation" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Login As</label>
        <div class="modern-input role-select-wrapper">
            <i class="fa-solid fa-users"></i>
            <select name="role" class="form-select custom-role-select" required>
                <option value="admin">👑 Admin</option>
                <option value="customer">🛍 Customer</option>
                <option value="user">👤 User</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="modern-input">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
        </div>
        {% if message %}
        <p class="form-error"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ message }}</p>
        {% endif %}
    </div>

    <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="modern-input">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control password-field" placeholder="Enter password" required>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 small">
        <label class="remember-box">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
        </label>
        <a href="{% url 'mainapp:forgethome' %}" class="auth-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn auth-btn w-100">
        <span>Login</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </button>

    <p class="auth-switch text-center mt-4 mb-0">
        New here? <a href="{% url 'mainapp:signuphome' %}">Create account</a>
    </p>
</form>
{% endblock %}
